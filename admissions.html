<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admissions | Join the Family | AI Island</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --navy-void: #020617; --cyan-glow: #38bdf8; --border: rgba(56, 189, 248, 0.15); }
        body { background-color: var(--navy-void); font-family: 'Urbanist', sans-serif; color: #fff; padding: 100px 10%; }
        .form-wrap { max-width: 600px; margin: 0 auto; background: rgba(255,255,255,0.03); padding: 50px; border: 1px solid var(--border); }
        input { width: 100%; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: #fff; margin-bottom: 20px; outline: none; }
        button { width: 100%; padding: 18px; background: var(--cyan-glow); border: none; font-weight: 800; text-transform: uppercase; cursor: pointer; color: var(--navy-void); }
    </style>
</head>
<body>
<div style="text-align:center; margin-bottom:50px;"><h1>ADMISSIONS</h1><p>Initiate Residency Inquiry</p></div>
<div class="form-wrap">
    <input type="text" placeholder="FULL NAME">
    <input type="email" placeholder="SECURE EMAIL">
    <input type="text" placeholder="NET WORTH BRACKET">
    <button>Submit for Vetting</button>
</div>
</body>
</html>
