<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SODR Compute Ring | Submerged Intelligence | AI Island</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Urbanist:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --navy-void: #020617; --cyan-glow: #38bdf8; --border: rgba(56, 189, 248, 0.15); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--navy-void); font-family: 'Urbanist', sans-serif; color: #fff; }
        .hero { height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(rgba(2,6,23,0.8), rgba(2,6,23,0.8)), url('http://googleusercontent.com/image_collection/image_retrieval/14339081692060849473'); background-size:cover; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); padding: 100px 10%; gap: 30px; text-align: center; }
        .stat-card { border: 1px solid var(--border); padding: 40px; }
        .stat-card h3 { font-family: 'JetBrains Mono'; color: var(--cyan-glow); font-size: 2.5rem; }
    </style>
</head>
<body>
<section class="hero"><h1>SODR <span>COMPUTE RING</span></h1><p style="font-family:'JetBrains Mono'; color:var(--cyan-glow);">Passive Oceanic Cooling Active</p></section>
<div class="stats-grid">
    <div class="stat-card"><h3>4.2°C</h3><p>Operating Temp</p></div>
    <div class="stat-card"><h3>1.2 YB</h3><p>Storage Capacity</p></div>
    <div class="stat-card"><h3>0.02ms</h3><p>Internal Latency</p></div>
</div>
</body>
</html>
